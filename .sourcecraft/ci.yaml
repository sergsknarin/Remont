on:
  push:
    - workflows: js-syntax-check
      filter:
        branches:
          - main

workflows:
  js-syntax-check:
    tasks:
      - name: check-js-syntax
        cubes:
          - name: node-check
            image: node:20-alpine
            script:
              - |
                status=0
                for f in $(find . -name "*.js" -not -path "./.git/*"); do
                  echo "Checking $f"
                  node --check "$f" || status=1
                done
                exit $status
