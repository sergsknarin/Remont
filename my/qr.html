<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>QR для клиента</title>
<style>body{margin:0;background:#fff;color:#111;font:16px -apple-system,Segoe UI,Arial,sans-serif;text-align:center;padding:24px 16px}
#q svg{width:min(80vw,420px);height:auto}p{max-width:560px;margin:12px auto;color:#555;word-break:break-all}button{font-size:16px;padding:10px 18px;margin-top:10px}
@media print{button{display:none}}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script></head><body>
<h2>Ваша машина в мастерской</h2><div id="q"></div>
<p>Наведите камеру телефона на код - откроется история обслуживания вашей машины.<br>Ссылка личная, не пересылайте её.</p>
<p id="u" style="font-size:12px"></p><button onclick="print()">Печать</button>
<script>
const u=location.hash.slice(1);
if(!/^https:\/\/[^\s]+#k=[A-Za-z0-9]{16,64}$/.test(u)){document.getElementById("q").innerHTML="<p>Нет ссылки - откройте QR из программы (карточка авто → «Ссылка для клиента»).</p>"}
else if(typeof qrcode!=="function"){document.getElementById("q").innerHTML="<p>Не загрузился генератор QR (нет интернета?). Ссылка ниже.</p>"}
else{const q=qrcode(0,"M");q.addData(u);q.make();document.getElementById("q").innerHTML=q.createSvgTag({cellSize:8,margin:4})}
document.getElementById("u").textContent=u;
</script></body></html>
