<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Возврат в приложение</title>
<style>body{margin:0;font:17px -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f2f2f7;color:#111;text-align:center;padding:40px 18px}
a.b{display:block;margin:22px auto 0;max-width:420px;padding:16px;border-radius:14px;background:#0a84ff;color:#fff;text-decoration:none;font-size:18px;font-weight:600}
p{color:#555;line-height:1.45;max-width:460px;margin:14px auto}</style></head><body>
<h2>Вход через ВК выполнен</h2><p id="t">Возвращаемся в приложение «Ремонт и автосервис»…</p>
<a class="b" id="b" href="#">Вернуться в приложение</a>
<p style="font-size:13px">Если приложение не открылось само - нажмите кнопку. Эта страница нужна только Android-приложению.</p>
<script>
/* 1.0 (сайт 0.31.0): VK ID возвращает сюда (в Chrome) после входа из Android-приложения; передаём код обратно в приложение */
const q=location.search.slice(1);
if(!/(^|&)(code|payload|error)=/.test(q)){document.getElementById("t").textContent="Нет данных входа. Нажмите «Войти через ВК» в приложении ещё раз.";document.getElementById("b").style.display="none"}
else{const u="intent://vk?"+q+"#Intent;scheme=remont;package=ru.sergsknarin.remont;end";
 document.getElementById("b").href=u;setTimeout(()=>{location.href=u},300)}
</script></body></html>
